<html lang="en">
<head>
<meta charset="UTF-8">

<title>Super Mesh Chat — P2P Video + Files</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// PeerJS CDN fallback: if unpkg fails, try jsdelivr then cdnjs
(function(){
  function load(src, cb){ var s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=function(){cb(new Error('fail'))}; document.head.appendChild(s); }
  if(typeof Peer!=='undefined') return;
  var fallbacks=[
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
  ];
  (function next(i){
    if(typeof Peer!=='undefined'){ window.dispatchEvent(new CustomEvent('smc-peerjs-ready')); return; }
    if(i>=fallbacks.length){ window.__PEERJS_FAILED__=true; window.dispatchEvent(new CustomEvent('smc-error',{detail:'PeerJS CDN failed'})); return; }
    load(fallbacks[i], function(){ setTimeout(function(){ next(i+1); },50); });
  })(0);
})();
</script>
<style>
:root{
  --bg-main:#111214; --bg-side:#1e1f22; --bg-card:#2b2d31; --bg-input:#2b2d31;
  --bg-hover:#35373c; --primary:#1a73e8; --primary-hover:#1765cc;
  --text:#dbdee1; --muted:#949ba4; --green:#23a55a; --yellow:#f0b232; --red:#f23f43;
  --radius:12px; --side-w:340px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{height:100vh;height:100dvh;background:var(--bg-main);color:var(--text);font-family:'Inter',"gg sans","Whitney","Helvetica Neue",Arial,sans-serif;overflow:hidden;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:8px;border:2px solid var(--bg-main)}
*{scrollbar-width:thin;scrollbar-color:#1a1b1e transparent}
#appLayout{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
#sidebar{width:var(--side-w);min-width:200px;max-width:420px;flex-shrink:0;background:var(--bg-side);display:flex;flex-direction:column;border-right:1px solid #000;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#8ab4f8);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.side-row{display:flex;align-items:center;gap:8px;padding:8px 16px}
#roomClock{font-variant-numeric:tabular-nums;font-weight:700;background:var(--bg-card);padding:6px 10px;border-radius:8px;font-size:13px}
#clockMobile{display:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:var(--muted)}
.status-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
#connStatus{width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px currentColor;flex-shrink:0}
#connStatus.on{background:var(--green);color:var(--green)}
#connStatus.off{background:var(--red);color:var(--red)}
#connStatus.warn{background:var(--yellow);color:var(--yellow)}
.id-box{margin:4px 16px 8px;background:var(--bg-card);border-radius:10px;padding:10px}
.id-box label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.6px}
.id-line{display:flex;align-items:center;gap:8px;margin-top:6px}
#roomPass{flex:1;min-width:0;background:#111214;border:1px solid #000;border-radius:7px;color:var(--text);padding:8px 10px;outline:none;font-family:monospace;font-size:13px}
#roomPass:focus{border-color:var(--primary)}
#btnJoin{background:var(--primary);color:#fff;font-weight:800}
#btnJoin:hover{background:var(--primary-hover)}
#btnJoin:disabled{opacity:.6;cursor:wait}
#roomName{font-size:11px;color:var(--muted);margin-top:6px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#diagBox{margin:0 16px 12px;font-size:11px;color:var(--muted)}
#diagBox summary{cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:11px}
#diagLines{font-family:monospace;font-size:10px;white-space:pre-wrap;margin-top:6px;max-height:120px;overflow-y:auto;background:#111214;border:1px solid #000;border-radius:7px;padding:6px 8px}
.icon-btn{background:var(--bg-hover);border:0;color:var(--text);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:14px}
.icon-btn:hover{background:#41434a}
#usernameInput{flex:1;min-width:0;background:#111214;border:1px solid #000;border-radius:7px;color:var(--text);padding:8px 10px;outline:none;font-family:inherit;font-size:13px}
#usernameInput:focus{border-color:var(--primary)}
.side-h{padding:10px 16px 6px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between}
#peerList{flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:6px}

.peer-card:hover{background:var(--bg-hover)}
.peer-top{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.yellow{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.dot.red{background:var(--red);box-shadow:0 0 6px var(--red)}
.peer-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ping{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.peer-ctrl{display:flex;align-items:center;gap:8px}
.peer-ctrl input[type=range]{flex:1;accent-color:var(--primary);height:4px;cursor:pointer}
.peer-ctrl span{font-size:10px;color:var(--muted)}
.self-note{margin:0 16px 14px;font-size:11px;color:var(--muted)}
#dragEdge{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;background:transparent;z-index:50}
#dragEdge:hover,#dragEdge.active{background:var(--primary)}
#sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}

#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-main)}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#131416;border-bottom:1px solid #000}
#btnMenu{display:none;background:var(--bg-card);border:0;color:#fff;font-size:18px;border-radius:8px;padding:6px 10px;cursor:pointer}
#roomTitle{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peerCount{background:var(--bg-card);font-size:12px;padding:3px 9px;border-radius:20px;color:var(--muted)}
.top-spacer{flex:1}
.top-btn{background:var(--bg-card);border:0;color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px}
.top-btn:hover{background:var(--bg-hover)}
.top-btn.active{background:var(--primary);color:#fff}
#videoGrid{display:none}
.msg video.chat-vid{width:170px;max-width:100%;border-radius:8px;margin-top:6px;display:block;background:#000;cursor:zoom-in}
#vidOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99990;cursor:zoom-out;flex-direction:column;gap:8px}
#vidOverlay video{max-width:94vw;max-height:88vh;border-radius:10px;box-shadow:0 10px 60px #000;background:#000}
#vidOverlay span{font-size:12px;color:var(--muted);font-weight:700}
.video-card{position:relative;aspect-ratio:1/1;background:#000;border-radius:14px;overflow:hidden;border:2px solid #232428;transition:transform .18s ease,border-color .18s;cursor:pointer}
.video-card:hover{transform:scale(1.025);border-color:#3a3d44}
.video-card.speaking{border-color:var(--green);box-shadow:0 0 0 2px var(--green),0 0 18px rgba(35,165,90,.5)}
.video-card video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.video-card .avatar-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#2b2d31,#1e1f22)}
.name-overlay{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mic-badge{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);border-radius:7px;padding:3px 7px;font-size:12px}
.mic-badge.muted{background:var(--red)}
#chatWrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 16px}
#chatStream{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 4px}
.msg{align-self:flex-start;width:fit-content;background:var(--bg-card);border-radius:12px;padding:9px 12px;max-width:78%;animation:fadeIn .25s ease both;word-wrap:break-word;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-style:italic}
.msg .meta{font-size:11px;opacity:.7;margin-bottom:3px;font-weight:700}
.msg img{max-width:220px;border-radius:8px;margin-top:6px;display:block;cursor:zoom-in}
.msg video{max-width:240px;width:100%;border-radius:8px;margin-top:6px;display:block;background:#000}
.msg audio{margin-top:6px;max-width:100%;display:block}
.msg a{color:#8ab4f8}
.msg.me a{color:#fff;text-decoration:underline}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#typingInd{min-height:18px;font-size:12px;color:var(--muted);font-style:italic;padding:2px 4px}
#chatStream .transfer{align-self:flex-start;max-width:78%;animation:fadeIn .25s ease both}
#chatStream .transfer.send{align-self:flex-end}
.transfer{background:var(--bg-card);border-radius:10px;padding:8px 10px;font-size:12px}
.transfer .t-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.transfer .t-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.transfer .t-meta{color:var(--muted);font-size:11px;margin:4px 0}
.transfer .t-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.transfer button{background:var(--bg-hover);border:0;color:var(--text);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px}
.transfer button:hover{background:#41434a}
.transfer button.primary{background:var(--primary);color:#fff}
.progress{height:8px;background:#111214;border-radius:20px;overflow:hidden;margin-top:4px}
.progress>div{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#8ab4f8);border-radius:20px;transition:width .2s}
#toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;background:#131416;border-top:1px solid #000;flex-wrap:wrap}
.tgl{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg-card);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .15s;flex-shrink:0}
.tgl:hover{transform:scale(1.07);background:var(--bg-hover)}
.tgl.off{background:var(--red)}
.tgl.live{background:var(--green)}
#msgInput{flex:1;min-width:140px;background:var(--bg-input);border:1px solid #000;color:var(--text);border-radius:12px;padding:12px 14px;outline:none;font-size:14px;font-family:inherit}
#msgInput:focus{border-color:var(--primary)}
#btnSend{background:var(--primary);border:0;color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;cursor:pointer;font-size:14px}
#btnSend:hover{background:var(--primary-hover)}
#dropOverlay{position:fixed;inset:0;background:rgba(26,115,232,.15);backdrop-filter:blur(2px);border:3px dashed var(--primary);border-radius:16px;margin:12px;display:none;place-items:center;font-size:22px;font-weight:800;z-index:100;pointer-events:none;text-align:center}
#dropOverlay.show{display:grid}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:99999;opacity:.95;display:none;border:1px solid #333}
#imgOverlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99990;cursor:zoom-out}
#imgOverlay img{max-width:94vw;max-height:94vh;border-radius:10px;box-shadow:0 10px 60px #000}
#errBanner{display:none;background:#3a1113;color:#ffb4b4;padding:8px 14px;font-size:13px;text-align:center;border-bottom:1px solid #5c1a1d}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;height:100dvh;transform:translateX(-105%);transition:transform .25s ease;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  #sidebar.open{transform:none}
  #btnMenu{display:block}
  #clockMobile{display:block}
  #roomClock{display:none}
  #videoGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));max-height:32vh}
  .msg{max-width:92%}
  #chatStream .transfer{max-width:92%}
  #toolbar{gap:6px}
  .tgl{width:38px;height:38px;font-size:15px}
}
</style>
</head>
<body>
<div id="errBanner"></div>
<div id="appLayout">
  <aside id="sidebar">
    <div class="brand"><div class="brand-mark">S</div><h1>Super Mesh Chat<small>peer-to-peer mesh &bull; mesh-v1</small></h1></div>

    <form id="joinForm" autocomplete="on" style="margin:0">
      <div class="id-box"><div class="id-line"><input id="usernameInput" name="username" type="text" maxlength="24" placeholder="Username…" autocomplete="username" spellcheck="false"></div><div class="id-line" style="margin-top:8px"><input id="roomPass" name="room-password" type="password" placeholder="room password" autocomplete="current-password" spellcheck="false"><button id="btnJoin" type="submit" class="icon-btn" title="Join room">Join</button></div><div id="roomName" title="PeerJS room ID">room: lobby</div></div>
    </form>
    <div class="side-h"><span>Peers — <span id="peerCountSide">0</span></span><span>mesh</span></div>

<script>
'use strict';
/* ============================================================
   Super Mesh Chat — single-file P2P mesh
   ROOM_ID fixed, channel mesh-v1, gossip + heartbeat + FileV2
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad2 = n => String(n).padStart(2,'0');
const fmtBytes = b => b<1024? b+' B' : b<1048576? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(2)+' MB';
const fmtETA = s => s==null? '—' : s<60? s+'s' : Math.floor(s/60)+'m '+pad2(s%60)+'s';
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2500); }
function showErr(m){ const b=$('#errBanner'); b.textContent=m; b.style.display='block'; }

/* ---------------- Web Audio synth (join/leave/notify + soundboard) ---------------- */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f0,f1,dur,type='sine',vol=.2,delay=0){ const c=ac(); if(!c) return; const t=c.currentTime+delay; const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }
function noiseBurst(dur=.6,vol=.3,fc=1200){ const c=ac(); if(!c) return; const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc; const g=c.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); }
const playJoin=()=>tone(660,880,.15,'sine',.22), playLeave=()=>tone(440,330,.18,'sine',.2), playNotify=()=>{tone(880,880,.09,'square',.10);tone(1320,1320,.07,'sine',.07,.06);};

/* ============================================================
   MODULE 1: Mesh connection stack (PeerJS 1.5.4, mesh-v1)
   ============================================================ */
window.SMC_hooks = window.SMC_hooks || {};
(function MeshStack(){
if(typeof Peer==='undefined'){ showErr('⚠ PeerJS CDN failed to load — check network. Retrying fallback…'); window.addEventListener('smc-peerjs-ready', ()=>location.reload()); setTimeout(()=>{ if(typeof Peer==='undefined') showErr('⚠ PeerJS still unavailable. App cross-signaling disabled; files/chat need PeerJS.'); },6000); return; }
const CHANNEL='mesh-v1';
const ROOM_PREFIX='superconf-mesh-';
function roomIdFromPass(p){ p=String(p||'').trim(); if(!p) return ROOM_PREFIX+'secretpassword'; if(p.indexOf(ROOM_PREFIX)===0) return p.slice(0,64); const clean=p.replace(/[^\w\-]/g,'').slice(0,40)||'secretpassword'; return (ROOM_PREFIX+clean).slice(0,64); }
let ROOM_ID=roomIdFromPass((function(){ try{ return localStorage.getItem('smc_room_pass')||'secretpassword'; }catch(e){ return 'secretpassword'; } })());
function currentPass(){ if(ROOM_ID.indexOf(ROOM_PREFIX)===0) return ROOM_ID.slice(ROOM_PREFIX.length); return ROOM_ID; }
const HB_INTERVAL=5000, WARN_AFTER=20000, DEAD_AFTER=40000, PENDING_AFTER=15000, MAX_RETRY=5;
let peer=null,myId=null,isHost=false,hbTimer=null,meshSyncTimer=null,reconcileTimer=null,epoch=0,initAttempt=0,initRetryTo=null;
const peers=new Map();
const pendingRetry=new Map();
const lastConnErr={}; // pid -> last data-connection error (survives deletion, shown in diag)
const errSeen=new Set(); // throttles repeat error toasts/chat per room+type
function linkEvent(pid,phase,name){ try{ window.dispatchEvent(new CustomEvent('smc-link',{detail:{pid,phase,name}})); }catch(e){} }
function hideErr(){ try{ const b=$('#errBanner'); if(b) b.style.display='none'; }catch(e){} }
function noteError(msg){ emit('smc-error',myId,{message:msg}); try{ toast(msg); }catch(e){} }
function teardownMesh(){
  try{ peers.forEach(rec=>{ try{ rec.conn&&rec.conn.close(); }catch(e){} }); }catch(e){}
  peers.clear(); pendingRetry.forEach(to=>{ try{clearTimeout(to);}catch(e){} }); pendingRetry.clear(); stopHeartbeat();
  try{ if(window.Media&&window.Media.calls){ Object.keys(window.Media.calls).forEach(k=>{ try{ window.Media.removeVideo(k); }catch(e){} }); } }catch(e){}
  try{ Array.from(document.querySelectorAll('[id^="chat-vid-"]')).forEach(m=>{ if(m.id!=='chat-vid-local') m.remove(); }); }catch(e){}
  const old=peer; peer=null; myId=null; epoch++; // invalidate callbacks from the old peer
  try{ old&&old.destroy(); }catch(e){}
  for(const k in lastConnErr){ try{delete lastConnErr[k];}catch(e){} }
  errSeen.clear();
  updateConn(false); onPeersChanged();
}
function scheduleInitRetry(reason){

      const pc=document.createElement('span'); pc.className='t-stat'; top.appendChild(pc); el.appendChild(top);
      const bar=document.createElement('div'); bar.className='progress';
      const fill=document.createElement('div'); fill.className='t-fill'; bar.appendChild(fill); el.appendChild(bar);

  window.addEventListener('touchmove',e=>{ if(!drag) return; const w=Math.min(420,Math.max(200,e.touches[0].clientX)); sb.style.width=w+'px'; },{passive:true});
  window.addEventListener('touchend',()=>drag=false);
  const ov=$('#sidebarOverlay');
  $('#btnMenu').addEventListener('click',()=>{ sb.classList.add('open'); ov.classList.add('show'); });
  ov.addEventListener('click',()=>{ sb.classList.remove('open'); ov.classList.remove('show'); });
})();

/* clock (room + mobile) */
setInterval(()=>{ const d=new Date(); const h12=d.getHours()%12||12; const ap=d.getHours()<12?'AM':'PM'; const s=h12+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds())+' '+ap; const rc=$('#roomClock'); if(rc) rc.textContent=s; const cm=$('#clockMobile'); if(cm) cm.textContent=h12+':'+pad2(d.getMinutes())+' '+ap; },1000);

/* wake lock: always on (no button) */
let wl=null;
async function reqWL(){ if(!('wakeLock' in navigator)) return false; try{ wl=await navigator.wakeLock.request('screen'); try{ wl.addEventListener('release',()=>{ if(document.visibilityState==='visible') reqWL(); }); }catch(e){} return true; }catch(e){ return false; } }
try{ reqWL(); }catch(e){}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reqWL(); });

$('#btnFull').addEventListener('click',async()=>{ try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }catch(e){ toast('Fullscreen blocked'); } });
const imgOv=$('#imgOverlay'), imgEl=imgOv.querySelector('img');
document.addEventListener('click',e=>{ const t=e.target.closest?e.target.closest('.msg img'):null; if(!t) return; imgEl.src=t.currentSrc||t.src; imgOv.style.display='flex'; });
imgOv.addEventListener('click',()=>imgOv.style.display='none');
const vidOv=$('#vidOverlay'), vidEl=vidOv.querySelector('video');
window.openVidOverlay=function(stream,label,muted){ try{ vidEl.srcObject=stream; vidEl.muted=!!muted; vidOv.style.display='flex'; const pr=vidEl.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} };
vidOv.addEventListener('click',()=>{ try{ vidEl.pause(); vidEl.removeAttribute('src'); vidEl.srcObject=null; }catch(e){} vidOv.style.display='none'; });

$('#btnFile').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',e=>{ sendFiles(e.target.files); e.target.value=''; });

/* ---------------- Media: cam / mic / screen + PeerJS calls ---------------- */
window.Media={ calls:{}, local:null, screen:null, outgoing:null, pendingPlay:new Set(), _unblockWired:false, _hinted:false,
  async ensureLocal(){
    if(this.local) return this.local;
    if(!this._askPromise){
      this._askPromise=(async()=>{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Camera/mic need HTTPS or localhost — data-only mode'); this._askPromise=null; return null; }
        let stream=null;
        try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); }
        catch(e){
          try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); toast('No camera found — voice-only mode'); }
          catch(e2){
            const n=e2&&e2.name;
            toast((n==='NotAllowedError'||n==='SecurityError')?'Mic/camera blocked — allow permission for voice chat':'No mic/camera found — data-only mode');
            this._askPromise=null; return null;
          }
        }
        this.local=stream; this.refreshLocalCard(); this.syncOutgoing(); return stream;
      })();
    }
    return this._askPromise;
  },
  async primePermissions(){
    // Ask for camera+mic permission up-front, but leave camera OFF (LED off, no broadcast)
    // until the user presses the Cam button. Mic stays ON.
    const s=await this.ensureLocal();
    try{
      const vt=s&&s.getVideoTracks&&s.getVideoTracks()[0];
      if(vt){
        try{ vt.enabled=false; }catch(e){}
        try{ vt.stop(); }catch(e){} // release hardware so light goes off; permission stays granted
        try{ s.removeTrack(vt); }catch(e){}
      }
    }catch(e){}
    try{
      this.syncOutgoing(); // now audio-only
      this.refreshLocalCard(); // removes local preview if it flashed
      const b=document.querySelector('#btnCam');
      if(b){ b.classList.add('off'); b.textContent='🚫'; }
    }catch(e){}
    return s;
  },
  redialAll(){
    // Re-call everyone with the current outgoing stream (needed when video tracks are added/removed,
    // since an audio-only call has no video sender to replaceTrack on).
    try{
      this.syncOutgoing();
      const pids=Object.keys(this.calls||{});
      pids.forEach(pid=>{ try{ const old=this.calls[pid]; delete this.calls[pid]; try{ old&&old.close(); }catch(e){} }catch(e){} });
      pids.forEach(pid=>{ try{ this.callPeer(pid); }catch(e){} });
      try{ this.dialAll(); }catch(e){}
      try{ this.refreshLocalCard(); }catch(e){}
    }catch(e){}
  },
  syncOutgoing(){
    // One managed stream for all outgoing calls: screen video wins, else camera; always plus mic.
    try{
      if(!this.outgoing){ try{ this.outgoing=new MediaStream(); }catch(e){ return; } }
      const out=this.outgoing;
      out.getVideoTracks().forEach(t=>{ try{ out.removeTrack(t); }catch(e){} });
      const scr=this.screen&&this.screen.getVideoTracks().find(t=>t.readyState==='live');
      const cam=this.local&&this.local.getVideoTracks().find(t=>t.readyState==='live');
      if(scr||cam){ try{ out.addTrack(scr||cam); }catch(e){} }
      const haveA=new Set(out.getAudioTracks());
      if(this.local) this.local.getAudioTracks().forEach(t=>{ if(!haveA.has(t)){ try{ out.addTrack(t); }catch(e){} } });
    }catch(e){}
  },
  dialAll(){ try{ const recs=window.Search?[...window.Search.peers.values()]:[]; recs.forEach(r=>{ if(!r.pending&&r.conn&&r.conn.open) this.callPeer(r.id); }); }catch(e){} },
  refreshLocalCard(){
    // Only show the broadcast square while desktop or webcam video is actually streaming
    let stream=null;
    try{
      const scr=this.screen&&this.screen.getVideoTracks().some(t=>t.readyState==='live');
      const cam=this.local&&this.local.getVideoTracks().some(t=>t.readyState==='live'&&t.enabled);
      if(scr) stream=this.screen; else if(cam) stream=this.local;
    }catch(e){}
    const existing=document.getElementById('chat-vid-local');
    if(stream){ this.addVideo('local',stream,true,(window.Search?window.Search.myName:'you')+' (you)'); }
    else if(existing){ existing.remove(); }
  },
  addVideo(id,stream,muted,label){
    // Streams live as chat messages: one small preview box per peer, click to fullscreen. No grid.
    const hasVid=stream&&stream.getVideoTracks&&stream.getVideoTracks().some(t=>t.readyState==='live');
    if(!hasVid){
      // Mic-only: no visual anywhere. Voice keeps playing through a hidden element.
      if(!muted&&stream){
        let au=document.getElementById('au-'+id);
        if(!au){ au=document.createElement('audio'); au.id='au-'+id; au.style.display='none'; au.autoplay=true; document.body.appendChild(au); }
        if(au.srcObject!==stream){ try{ au.srcObject=stream; }catch(e){} }
        try{ const rec=window.Search.peers.get(id); if(rec){ rec.videoEl=au; if(rec.volume!=null) au.volume=rec.volume; } }catch(e){}
        try{ const pr=au.play(); if(pr&&pr.catch) pr.catch(()=>{ try{ const M=window.Media; M.pendingPlay.add(au); }catch(e){} }); }catch(e){}
      }
      return null;
    }
    let box=document.getElementById('chat-vid-'+id);
    if(!box){
      box=document.createElement('div'); box.className='msg'+(id==='local'?' me':''); box.id='chat-vid-'+id;
      const meta=document.createElement('div'); meta.className='meta';
      meta.textContent=(label||id)+' • '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      box.appendChild(meta);
      const vd=document.createElement('video'); vd.className='chat-vid'; vd.playsInline=true; vd.muted=!!muted;
      vd.addEventListener('click',()=>{ try{ window.openVidOverlay(vd.srcObject,(label||id),vd.muted); }catch(e){} });
      box.appendChild(vd);
      chatStream.appendChild(box); chatStream.scrollTop=chatStream.scrollHeight;
      while(chatStream.children.length>300) chatStream.firstChild.remove();
    }
    const v=box.querySelector('video'); if(v.srcObject!==stream){ try{ v.srcObject=stream; }catch(e){} }
    v.muted=!!muted;
    if(id!=='local'){ try{ const rec=window.Search.peers.get(id); if(rec){ rec.videoEl=v; if(rec.volume!=null) v.volume=rec.volume; } }catch(e){} }
    try{
      const pr=v.play();
      if(pr&&pr.catch) pr.catch(()=>{ try{
        const M=window.Media; M.pendingPlay.add(v);
        if(!M._unblockWired){ M._unblockWired=true; const go=()=>{ try{ M.pendingPlay.forEach(el=>{ try{ const q=el.play(); if(q&&q.catch) q.catch(()=>{}); }catch(e){} }); M.pendingPlay.clear(); }catch(e){} }; document.addEventListener('click',go); document.addEventListener('keydown',go); }
        if(!M._hinted){ M._hinted=true; toast('Tap anywhere to enable voice'); }
      }catch(e){} });
    }catch(e){}
    return box;
  },
  removeVideo(id){ const b=document.getElementById('chat-vid-'+id); if(b) b.remove(); try{ const au=document.getElementById('au-'+id); if(au) au.remove(); }catch(e){} if(this.calls[id]){ try{this.calls[id].close();}catch(_){} delete this.calls[id]; } },
  callPeer(pid){
    const peer=window.Search?window.Search.peer:null; if(!peer||typeof peer.call!=='function') return;
    const out=this.outgoing||this.local; if(!out) return;
    if(this.calls[pid]||pid===window.Search.myId) return;
    try{ const call=peer.call(pid,out); this.calls[pid]=call;
      call.on('stream',s=>{ this.addVideo(pid,s,false,(window.Search.peers.get(pid)||{}).name||pid.slice(0,6)); playJoin(); });
      call.on('close',()=>this.removeVideo(pid)); call.on('error',()=>this.removeVideo(pid));
    }catch(e){}
  },
  onIncomingCall(call){
    const self=this;
    (async()=>{ await self.ensureLocal(); self.syncOutgoing(); const out=self.outgoing||self.local; if(!out) return; try{ call.answer(out); }catch(e){ return; }
      call.on('stream',s=>{ self.addVideo(call.peer,s,false,(window.Search.peers.get(call.peer)||{}).name||call.peer.slice(0,6)); playJoin(); });
      call.on('close',()=>self.removeVideo(call.peer));
    })();
  },
  onSignal(){}
};
window.addEventListener('smc-peers',()=>{ try{ if(window.Media&&(window.Media.outgoing||window.Media.local)) window.Media.dialAll(); }catch(e){} });
$('#btnCam').addEventListener('click',async e=>{
  const b=e.currentTarget, M=window.Media;
  try{
    const s=await M.ensureLocal();
    if(!s){ toast('No mic/camera found — data-only mode'); return; }
    const live=s.getVideoTracks? s.getVideoTracks().find(t=>t.readyState==='live') : null;
    if(!live){
      // Camera OFF -> turn ON (fast: permission was already primed at startup)
      b.disabled=true;
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Camera needs HTTPS or localhost'); return; }
        const ns=await navigator.mediaDevices.getUserMedia({video:true});
        const nt=ns.getVideoTracks()[0];
        if(!nt) throw new Error('no-video-track');
        try{ s.addTrack(nt); }catch(_){}
        try{ ns.getAudioTracks().forEach(t=>{ try{t.stop();}catch(_){} }); }catch(_){}
        try{ nt.enabled=true; }catch(_){}
        // keep reference so stopping the temp container doesn't kill the live track in some browsers
        try{ ns.removeTrack(nt); }catch(_){}
        b.classList.remove('off'); b.textContent='📷';
      }catch(err){ toast('Camera blocked or not found'); b.classList.add('off'); b.textContent='🚫'; return; }
      finally{ b.disabled=false; }
    }else{
      // Camera ON -> turn OFF + release hardware so LED goes off
      try{ live.enabled=false; }catch(_){}
      try{ live.stop(); }catch(_){}
      try{ s.removeTrack(live); }catch(_){}
      b.classList.add('off'); b.textContent='🚫';
    }
    try{ M.redialAll(); }catch(_){ try{ M.syncOutgoing(); M.refreshLocalCard(); }catch(__){} }
  }catch(err){ try{ toast('Camera toggle failed'); }catch(_){} }
});
$('#btnMic').addEventListener('click',async e=>{ const s=await window.Media.ensureLocal(); const t=s&&s.getAudioTracks()[0]; if(!t) return; t.enabled=!t.enabled; e.currentTarget.classList.toggle('off',!t.enabled); e.currentTarget.textContent=t.enabled?'🎙️':'🔇'; });
$('#btnScreen').addEventListener('click',async e=>{
  const b=e.currentTarget, M=window.Media;
  try{
    if(M.screen){ M.screen.getTracks().forEach(t=>t.stop()); M.screen=null; M.syncOutgoing(); const cam=M.local&&M.local.getVideoTracks().find(t=>t.readyState==='live');
      if(cam){ Object.values(M.calls).forEach(c=>{ try{ const snd=c.peerConnection&&c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video'); if(snd&&cam) snd.replaceTrack(cam); }catch(_){} }); }
      else { try{ M.redialAll(); }catch(_){} }
      b.classList.remove('live'); b.textContent='🖥️'; try{window.Search.broadcast({t:'signal',kind:'screen-stop'});}catch(_){} try{M.refreshLocalCard();}catch(_){} return; }
    const ds=await navigator.mediaDevices.getDisplayMedia({video:true}); M.screen=ds; M.syncOutgoing(); const st=ds.getVideoTracks()[0];
    const redial=[];
    Object.values(M.calls).forEach(c=>{ try{ const snd=c.peerConnection&&c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video'); if(snd&&st) snd.replaceTrack(st); else redial.push(c.peer); }catch(_){ try{redial.push(c.peer);}catch(e){} } });
    redial.forEach(pid=>{ try{ const old=M.calls[pid]; delete M.calls[pid]; try{ old&&old.close(); }catch(e){} }catch(e){} try{ M.callPeer(pid); }catch(e){} });
    try{window.Search.broadcast({t:'signal',kind:'screen-start'});}catch(_){}
    st.onended=()=>b.click(); b.classList.add('live'); b.textContent='⏹️'; try{M.refreshLocalCard();}catch(_){}
  }catch(err){ toast('Screen share cancelled'); }
});
window.addEventListener('smc-open',()=>{ renderPeers(); try{ if(window.Media&&window.Media.local){ window.Media.local.getAudioTracks().forEach(t=>{ try{ t.enabled=true; }catch(e){} }); const mb=$('#btnMic'); if(mb){ mb.classList.remove('off'); mb.textContent='🎙️'; } } }catch(e){} });
addMsg({sys:true,text:'🚀 Super Mesh Chat v2.8 ready — type the room password in the sidebar and press Join (or Enter). Share the same password with peers to meet in one room.'});
renderPeers();
/* startup: prime mic+camera permission, but leave camera OFF until user presses Cam */
try{ if(window.Media&&window.Media.primePermissions) window.Media.primePermissions(); }catch(e){}
})();
